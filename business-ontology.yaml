        contains_pii: false
        classification: NOT_PII
      findings:
      - status: RESOLVED
        finding: 'Lineage is broken and load quality is poor. Total rows rejected
          at load: 2,409,074. Batches not SUCCESS/COMPLETED: 4,860 of 12,000 (40.5%).
          PMS extracts FAILED: 3,724 of 15,000 (24.8%). PMS extracts PARTIAL: 3,711
          of 15,000 (24.7%). Distinct BATCH_ID in BATCH_LOAD_AUDIT: 2,867. Distinct
          BATCH_ID in RESERVATIONS: 1 (BATCH_REBUILD). RESERVATIONS batches present
          in the audit: 0.'
        severity: critical
        implication: 'Roughly half of all PMS extracts are failed or partial, 2.4M
          rows were rejected, and the reservation data cannot be traced to any audited
          batch. No KPI can currently be asserted as complete. See business_rules:
          BR-27.'
      business_key: 'BATCH_ID — but see findings: RESERVATIONS carries only one BATCH_ID
        value (BATCH_REBUILD) and it does not reconcile to any audited batch'
      demo_question: ''
      approval_scope: accepted_assumption
