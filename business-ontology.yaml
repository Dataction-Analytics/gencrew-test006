  - id: entity.folio.charge
    name: Payment / Folio Transaction
    unit: ''
    grain: two distinct grains under one canonical concept — one_row_per_charge_line_item
      (FOLIO_CHARGES) and one_row_per_payment_transaction (PAYMENTS)
    owner: ''
    status: proposed
    values: {}
    aliases:
    - Folio Line
    - Transaction
    - Charge
    - Payment
    - Folio Item
    formula: ''
    question: ''
    attributes:
      pii:
        note: FOLIO_CHARGES itself carries no direct PII (charge type/amount/date
          only). PAYMENTS.CARD_LAST4 is a truncated card number, not full cardholder
          data — see the field note for why this is NOT PCI-DSS-sensitive scope despite
          being financial data. Rolled up to QUASI, the highest field-level rating
          present.
        fields:
        - note: PCI DSS explicitly permits storing/displaying a truncated PAN (max
            first 6 / last 4 digits) without full Cardholder Data Environment controls
            — truncation is the standard technique used specifically to reduce PCI
            scope, so this field is NOT 'PCI-sensitive' in the way a full card number
            would be. It is still linked personal/financial data under GDPR/CCPA (identifies
            which payment instrument a specific guest used) via RESERVATION_ID ->
            GUEST_ID, so treat as QUASI, not public, but do not apply full-PAN-grade
            controls to it.
          field: CARD_LAST4
          classification: QUASI
        - note: Foreign key; re-identifies the guest via RESERVATIONS -> GUESTS.
          field: RESERVATION_ID
          classification: INDIRECT
        contains_pii: true
        classification: QUASI
      findings:
      - status: NOT_IN_DATA
        finding: '13 of the 14 canonical cost heads are absent: no tax line, no service
          charge, no resort/facility fee, no extra-person charge, no early/late fee,
          no package allocation, no discount, no commission, no comp/allowance, no
          deposit, no security-deposit hold, no refund/chargeback, no loyalty redemption.'
      - status: NOT_IN_DATA
        finding: BR-15 (tax exclusion) unanswerable. No tax field exists. Whether
          CHARGE_AMOUNT is gross or net of tax is undeterminable from the data and
          remains a genuine [CONFIRM] — a materially different answer for every money
          KPI.
      - status: NOT_IN_DATA
        finding: BR-16 (service charge) unanswerable. No such line.
      - status: NOT_IN_DATA
        finding: BR-17 (commission gross vs net) unanswerable. Rate stored on CHANNELS,
          money never posted.
      - status: NOT_IN_DATA
        finding: BR-18 (package allocation) unanswerable as a charge, though RATE_PLANS.BOARD_TYPE
          proves bundled board IS sold (BB/HB/FB/AI = 4 of 5 board types). Bundled
          rates exist and are 100% booked to a single charge stream — precisely the
          overstatement risk the canonical model warns about, now confirmed as present
          and unmitigated.
      - status: RESOLVED
        finding: 'No contra-revenue of any kind exists: FOLIO_CHARGES has 0 negative
          and 0 zero amounts across 20.5M rows. No refunds, no discounts, no adjustments.'
      - status: RESOLVED
        finding: 'PAYMENTS.STATUS has exactly one value: CAPTURED (all 10,264,418
          rows). No authorizations, no failures, no refunds, no chargebacks.'
        section: Payments
      - status: RESOLVED
        finding: 'Methods are 4-way and near-uniform: WALLET, CARD, CASH, BANK_TRANSFER
          (~2.56M each).'
        section: Payments
      - status: RESOLVED
        finding: 'Payments settle in full, once, at reservation grain: SUM(PAYMENT_AMOUNT)
          = SUM(RESERVATIONS.TOTAL_AMOUNT) = 14,291,197,609 for realised bookings,
          with 0 mismatching reservations.'
        section: Payments
      - status: NOT_IN_DATA
        finding: BR-14 — advance deposits do not exist. There is no deposit, no partial
          payment, no payment-before-stay concept. The elaborate canonical contract-liability
          model has nothing to attach to here.
        section: Payments
      - status: RESOLVED
        finding: Header, folio and payments reconcile exactly (0 mismatching reservations;
          folio total differs by 9,496 on 14.29bn, i.e. rounding).
        section: Revenue recognition
        severity: defect
      - status: REFUTED
        finding: 'Revenue includes stays that have not happened yet. Confirmed (future)
          bookings already carry 14,569,180 stay-nights and 5,006,967,683 of value
          — future-dated, unconsumed. Any unfiltered SUM mixes realised and unrealised
          revenue. See business_rules: BR-25.'
        section: Revenue recognition
        severity: critical
      - status: REFUTED
        finding: 'Cancellation penalties are stranded outside the revenue path. CANCELLATIONS.PENALTY_AMOUNT
          totals 195,001,178.30, yet cancelled bookings have zero folio charges and
          zero payments. This is real forfeiture revenue that no KPI built on FOLIO_CHARGES
          or PAYMENTS will ever see. See business_rules: BR-24.'
        section: Revenue recognition
        severity: critical
      business_key: CHARGE_ID (folio line) / PAYMENT_ID (payment) — both are surrogate
        keys; neither table carries a natural business key
      demo_question: ''
      approval_scope: accepted_assumption
      realized_tables:
      - folio_charges
      - payments
      canonical_attributes:
      - Transaction ID
      - Booking (FK)
      - Room-Night (FK, where applicable)
      - Charge Type (canonical)
      - Amount
      - Currency
      - Posting Date
      - Business Date
      - Tax Jurisdiction/Rate
      - GL/Department Code
    definition: A financial line item posted to a guest's folio — a charge, tax, payment,
      adjustment, or refund. A single room-night almost always generates several folio
      lines, not one.
