          and can differ from each other within a single row (e.g. 12/06/2026 alongside
          16-Jun-2026).
      - status: RESOLVED
        finding: BOOKING_STATUS has 15 raw variants — a different variant set from
          RESERVATIONS.STATUS.
      - status: RESOLVED
        finding: GROSS_AMOUNT is TEXT (100% numeric-parseable, but untyped).
      - status: RESOLVED
        finding: Arrival window runs to 2026-12-31, four months beyond the PMS window
          — so the feed is not a subset of, or reconcilable to, RESERVATIONS.
      - status: RESOLVED
        implication: Dedup is blocked on a missing key, not a missing decision. This
          is an upstream integration fix, and should be raised as a defect rather
          than an interview question.
      business_key: intended key is EXTERNAL_BOOKING_REF, but it does not join to
        RESERVATIONS.CONFIRMATION_NO (see BR-01) — FEED_ROW_ID is a surrogate key
