          baseline model calls dedup ''the single highest-impact rule in the entire
          ontology.'' It cannot be executed: EXTERNAL_BOOKING_REF -> RESERVATIONS.CONFIRMATION_NO
          gives 0 matches of 60,000; GUEST_EMAIL -> GUESTS.EMAIL gives 0 matches (feed
          emails are placeholder addresses); HOTEL_CODE -> HOTELS.HOTEL_CODE gives
          60,000 matches (100%) — the only working join.'
        severity: critical
