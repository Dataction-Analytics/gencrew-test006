          (100%), and equals room-only folio for 0. Totals: 14,291,197,609 vs true
          room-only 12,147,522,871 — an inflation factor of 1.1765. Using it as the
          ADR numerator yields 345.16 instead of 293.39, a +17.65% overstatement,
          and propagates identically into RevPAR. See business_rules: BR-21.'
