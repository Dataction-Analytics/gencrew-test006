          field: GUEST_ID
          classification: INDIRECT
        contains_pii: true
        classification: INDIRECT
      findings:
      - status: REFUTED
        finding: No 'Checked-in / In-house' state exists. There is no in-house status
          and no actual-arrival timestamp. A booking goes straight from Confirmed
          to Checked-out. Any operational report needing in-house counts must derive
          them from STAY_NIGHTS against the current date.
      - status: REFUTED
        finding: No 'Void' status exists. The baseline's BR-03 asks how Void is treated;
          BR-03 is void here — the value does not occur. Retained in the register
          for portability only.
      - status: NOT_IN_DATA
        finding: 'No ''Amended/Modified'' state and no last-modified timestamp. BR-04
          (do amendments mutate or create a new booking_id?) is unanswerable — there
          is no modification audit trail of any kind. The baseline calls amendment
          handling ''the #1 cause of double-counted demand''; here it is simply invisible.'
      - status: RESOLVED
        finding: 'BR-02 — No-show is NOT Cancelled, and carries no revenue. Sharper
          than the baseline predicted: no-shows (482,392) have zero stay-nights, zero
          folio charges, zero payments, and no CANCELLATIONS row. The baseline''s
          claim that a no-show ''is often billed per the cancellation policy and can
          carry revenue'' is false in this source. A no-show here is pure demand loss.'
      - status: RESOLVED
        finding: Cancellations are cleanly separated. A CANCELLATIONS row exists for
          1,411,898 of 1,411,898 Cancelled bookings and for no other status — perfect
          1:1, no leakage.
      - status: RESOLVED
        finding: No occupancy leakage. Cancelled and No-show bookings generate 0 STAY_NIGHTS
          rows and 0 RESERVATION_ROOMS rows. The 1,894,290 reservations without a
          room assignment are exactly Cancelled (1,411,898) + No-show (482,392).
      - status: BLOCKED
        finding: BR-01 — deduplication. See the ota_feed_raw entity; the join key
          needed to do it does not exist.
