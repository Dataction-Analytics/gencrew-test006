  - id: entity.date.timeline
    name: Date / Timeline Dimension (Booking Lifecycle Timeline)
    unit: ''
    grain: not a fact table — a cross-cutting dimension; conceptually one_row_per_date_event_per_booking
    owner: ''
    status: proposed
    values: {}
    aliases:
    - Booking Lifecycle
    - Timeline
    - Date Dimension
    - Booking Timeline
    formula: ''
    question: ''
    attributes:
      pii:
        note: Dates and timestamps are not PII by themselves. DATE_OF_BIRTH is governed
          under the guest entity, not here.
        contains_pii: false
        classification: NOT_PII
      findings:
      - status: REFUTED
        finding: 'The two most important dates in the model are stored as TEXT in
          three incompatible formats. RESERVATIONS.CHECK_IN_DATE and CHECK_OUT_DATE
          are VARCHAR: YYYY-MM-DD (ISO) = 7,664,378 rows (63.0%); NN/NN/YYYY (slash,
          mixed convention) = 3,772,430 rows (31.0%); DD-MON-YYYY (e.g. 01-MAY-2026)
          = 721,900 rows (5.9%).'
        severity: critical
      - status: RESOLVED
        finding: 'The slash bucket is not one convention — it is two, mixed together:
          provably DD/MM/YYYY = 2,160,863 rows (fails an MM/DD/YYYY parse, day > 12);
          provably MM/DD/YYYY = 193,273 rows (fails a DD/MM/YYYY parse, month > 12);
          irreducibly ambiguous (both parse, different dates) = 1,418,294 rows (both
          components <= 12).'
      - status: REFUTED
        finding: BR-11 as originally written ('a date parsing standard per source
          system') cannot work. SOURCE_SYSTEM does not predict format — all 7 source
          systems carry the same ~63/31/6 mix. A per-source parsing rule would corrupt
          every system equally. Replaced by BR-22.
      - status: RESOLVED
        finding: 'NIGHTS is a reliable arbiter. Where both dates parse, DATEDIFF(day,
          check_in, check_out) = NIGHTS for 11,928,818 rows with 0 mismatches, 0 negative
          stays, 0 zero-night stays. Of the 193,273 provably-MM/DD rows, 158,466 (82%)
          reconcile with NIGHTS under MM/DD — confirming the mixture is genuine, not
          noise. Recommended rule: parse ISO -> DD-MON-YYYY -> then for slash dates
          try both conventions and let NIGHTS disambiguate; quarantine the residue.'
        residual_risk: For the 1,418,294 ambiguous rows, NIGHTS narrows but cannot
          always uniquely resolve the pair. A single-format parse silently mis-dates
          at least 193,273 bookings (1.6%) — the exact failure mode the baseline predicted,
          now measured.
      - status: NOT_IN_DATA
        finding: BR-20 — Business Date semantics. DAILY_HOTEL_PERFORMANCE.BUSINESS_DATE
          exists but there is no night-audit timestamp, so the cutoff convention is
          undocumented and untestable. HOTELS.TIMEZONE is populated but no timestamp
          is timezone-aware (TIMESTAMP_NTZ throughout). Genuine [CONFIRM].
      - status: RESOLVED
        finding: Booking Lead Time is computable (CHECK_IN_DATE - BOOKED_AT), as is
          Cancellation Lead Time (CHECK_IN_DATE - CANCELLED_AT) — both subject to
          the date-parsing rule above.
      business_key: n/a — dates are attributes of other entities (RESERVATIONS, STAY_NIGHTS,
        FOLIO_CHARGES, etc.), not a standalone keyed entity
      demo_question: ''
      approval_scope: accepted_assumption
      realized_tables: []
      canonical_attributes: []
    definition: The full set of distinct date/timestamp events across a booking's
      life. Hospitality data has an unusually large number of dates that all sound
      similar but answer different questions — conflating any two of them is one of
      the most common and hardest-to-spot causes of KPI disagreement.
    depends_on: []
