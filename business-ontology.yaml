          fallback is also unavailable: guest email is placeholder, room type is free
          text that does not map, and arrival dates carry the same mixed-format problem.'
      - status: RESOLVED
        finding: 53,948 of 60,000 rows (89.9%) have an OTA_NAME that disagrees with
          SOURCE_SYSTEM (e.g. Trip.com tagged OTA_AGODA).
      - status: RESOLVED
        finding: 29,838 rows (49.7%) carry a non-OTA SOURCE_SYSTEM (DIRECT_WEB, PMS,
          GDS_AMADEUS, CHANNEL_MGR) inside a table named 'OTA feed'.
      - status: RESOLVED
