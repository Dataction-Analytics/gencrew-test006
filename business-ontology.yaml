  - id: entity.review
    name: Review
    unit: ''
    grain: one_row_per_review_per_reservation
    owner: ''
    status: proposed
    values: {}
    aliases:
    - Guest Review
    - Feedback
    - Rating
    - Guest Satisfaction Record
    formula: ''
    question: ''
    attributes:
      pii:
        note: RATING/CLEANLINESS/SERVICE_SCORE/VALUE_SCORE are not identifying. GUEST_ID
          is a direct foreign key to the guest (INDIRECT), and free-text TITLE carries
          incidental-PII risk (guests occasionally name themselves, other guests,
          or staff in free text). Rolled up to QUASI, the highest field-level rating
          present (TITLE outranks the GUEST_ID foreign key under the SENSITIVE > DIRECT
          > QUASI > INDIRECT order).
        fields:
        - note: Foreign key; re-identifies via GUESTS.
          field: GUEST_ID
          classification: INDIRECT
        - note: Free text — incidental-PII risk, not structurally guaranteed but not
            excludable either; recommend a PII-scan step before any downstream text
            analytics.
          field: TITLE
          classification: QUASI
        contains_pii: true
        classification: QUASI
      findings:
      - status: RESOLVED
        finding: Cleanly scoped — reviews exist only against Checked-out reservations
          (531,225 of 531,225). 0 orphans.
      - status: REFUTED
        finding: 'RATING is statistically unrelated to its own sub-scores. Correlation
          between RATING and the mean of (CLEANLINESS, SERVICE_SCORE, VALUE_SCORE)
          is 0.0031 — effectively zero — despite both averaging 3.00 on a uniform
          1-5 distribution. A composite guest-satisfaction KPI built on these fields
          is not defensible. See business_rules: BR-28.'
        severity: critical
      business_key: REVIEW_ID is the surrogate key; RESERVATION_ID is the natural
        link back to the stay (1:1 where a review exists)
      demo_question: ''
      approval_scope: accepted_assumption
      realized_tables:
      - reviews
      canonical_attributes: []
    definition: 'Review. Grain: one_row_per_review_per_reservation.'
